# generated by quick-start.sh - receives the agent's OTLP and forwards to all backends
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        tls:
          cert_file: /certs/server.crt
          key_file: /certs/server.key
          client_ca_file: /certs/ca.crt
      http:
        endpoint: 0.0.0.0:4318
        tls:
          cert_file: /certs/server.crt
          key_file: /certs/server.key
          client_ca_file: /certs/ca.crt

exporters:
  otlphttp/prometheus:
    endpoint: https://prometheus:9090/api/v1/otlp
    tls:
      ca_file: /certs/ca.crt
      cert_file: /certs/client.crt
      key_file: /certs/client.key
  otlphttp/grafana-otel:
    endpoint: https://grafana-otel:4318
    tls:
      ca_file: /certs/ca.crt
  otlphttp/victoriametrics:
    endpoint: http://victoriametrics:8428/opentelemetry

service:
  pipelines:
    metrics:
      receivers: [otlp]
      exporters: [otlphttp/prometheus, otlphttp/grafana-otel, otlphttp/victoriametrics]
