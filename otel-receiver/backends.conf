# Configuration for the OTLP receiver stack, read by quick-start.sh and agent-config.sh.
#
# All backends are always deployed and visible in Grafana. Per backend:
#   TLS      none|tls|mtls     how agents authenticate to this backend
#                              tls  = backend presents a certificate, agent verifies it
#                              mtls = additionally the agent must present a client certificate
#   CERTS    shared|dedicated  shared server certificate for all backends, or one
#                              per backend (both signed by the same CA, so the agent
#                              always points caCertPath at certs/ca.crt)
#
# Any TLS mode works with any CERTS mode. The defaults spread the modes across
# the backends so every flavor is exercised by the base setup:
#   prometheus      mtls + shared     agent must present the client certificate
#   grafana-otel    tls  + dedicated  own server certificate, agent verifies via ca.crt only
#   victoriametrics                   this VictoriaMetrics version has no -mtls
#                                     flag, so none or tls only
#
# The agent's client key can be PEM-encrypted to exercise the agent's
# clientKeyPassword flow:
#   CLIENT_KEY_PASSWORD=secret    empty = unencrypted client key (default)
# When set, agent-config.sh points the payload at certs/client-encrypted.*;
# the plain client.* pair keeps serving the stack-internal TLS clients
# (collector fan-out, grafana datasources - they cannot decrypt PEM keys).
# Changing or clearing the password regenerates the client-encrypted keypair.
CLIENT_KEY_PASSWORD=test123

# Prometheus with its native OTLP receiver
PROMETHEUS_TLS=mtls
PROMETHEUS_CERTS=shared

# Grafana's OTLP backend, the grafana/otel-lgtm image (collector + prometheus + grafana)
GRAFANA_OTEL_TLS=none

# VictoriaMetrics - prometheus-compatible store with native OTLP ingest; speaks
# the same PromQL so the dashboard's Backend dropdown covers it like any other
VICTORIAMETRICS_TLS=tls
VICTORIAMETRICS_CERTS=dedicated

# Dedicated OpenTelemetry Collector - receives the agent's OTLP and forwards to
# ALL THREE backends above. Point the agent at it (single slot) to feed every
# backend through one hop; do NOT also target the backends directly in that
# mode - they would receive the same series twice
COLLECTOR_TLS=mtls
COLLECTOR_CERTS=shared
